<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Home Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#111; --card:#1b1b1b; --line:#2c2c2c; --text:#eee; --sub:#9a9a9a;
  --accent:#43a047; --danger:#e53935; --warn:#fb8c00; --info:#42a5f5;
  --num:'Doto','JetBrains Mono',monospace; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:480px;margin:0 auto;padding:0 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.header h1{font-family:var(--num);font-weight:900;letter-spacing:.09em;text-transform:uppercase;
  font-size:clamp(20px,6vw,28px);white-space:nowrap}
.header-dot{color:var(--accent)}
.hbtns{display:flex;gap:6px;align-items:center}
.ibtn{background:none;border:none;color:var(--text);font-size:22px;padding:6px;cursor:pointer}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.sdot.ok{background:var(--accent)}.sdot.busy{background:var(--warn)}.sdot.err{background:var(--danger)}
.date{font-family:var(--mono);color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);font-weight:600;margin-bottom:10px}
.card h2 .go{margin-left:auto;color:var(--sub);font-size:18px;text-decoration:none}
.big{font-family:var(--num);font-size:clamp(28px,9vw,40px);font-weight:900;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:none}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-family:var(--mono);font-size:12px;color:var(--sub)}
.badge{font-family:var(--mono);font-size:11px;border-radius:8px;padding:2px 7px}
.badge.expired{color:#fff;background:var(--danger)}
.badge.soon{color:#111;background:var(--warn)}
.badge.info{color:#111;background:var(--info)}
.muted{color:var(--sub);font-size:13px}
.err-t{color:var(--danger);font-size:13px}
.sum{display:flex;gap:18px;margin-bottom:6px}
.sum small{display:block;color:var(--sub);font-size:11px;margin-bottom:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent)}
.cat{font-size:13px;margin-top:8px}
.cat div:first-child{display:flex;justify-content:space-between}
.skeleton{color:var(--sub);font-size:13px}
/* 設定 */
#settings{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:env(safe-area-inset-top) 16px 40px}
#settings .in{max-width:480px;margin:0 auto}
#settings h2{font-size:18px;margin:18px 0 12px}
label{display:block;font-size:12px;color:var(--sub);margin:14px 0 4px}
input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 10px}
.wd{border-radius:10px;padding:6px 0 5px;text-align:center;border:1px solid transparent;cursor:pointer;font-family:var(--mono);min-width:0}
.wd .dow{font-size:10px;color:var(--sub)}
.wd .dn{font-size:16px;font-weight:600;margin:2px 0}
.wd.today .dn{color:var(--accent)}
.wd.sel{background:var(--bg);border-color:var(--line)}
.wd.out .dn,.wd.out .dow{opacity:.45}
.dots{display:flex;justify-content:center;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.expired{background:var(--danger)}.dot.soon{background:var(--warn)}.dot.ok{background:var(--accent)}.dot.task{background:var(--info)}
.wd .yen{font-size:9px;color:var(--sub);margin-top:4px;height:11px;white-space:nowrap;overflow:hidden}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.calnav .rng{font-family:var(--mono);font-size:13px}
.calnav button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;min-width:36px;height:30px;font-size:14px;cursor:pointer;padding:0 8px}
.calnav .grp{display:flex;gap:6px}
.dayh{font-size:13px;color:var(--sub);margin:4px 0 2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.order-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14px}
.order-row .nm{flex:1}
.order-row button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;width:40px;height:36px;font-size:16px;cursor:pointer}
.order-row button:disabled{opacity:.3;cursor:default}
.help{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Home<span class="header-dot">.</span></h1>
    <div class="hbtns">
      <span class="sdot" id="sdot" title="同期状態"></span>
      <button class="ibtn" id="btnRefresh" aria-label="更新"><i class="ti ti-refresh"></i></button>
      <button class="ibtn" id="btnSettings" aria-label="設定"><i class="ti ti-settings"></i></button>
    </div>
  </div>
  <div class="date" id="today"></div>

  <div class="card" id="cardFood"></div>
  <div class="card" id="cardRestock"></div>
  <div class="card" id="cardTasks"></div>
  <div class="card" id="cardCal"></div>
  <div class="card" id="cardBudget"></div>
  <div class="card" id="cardMed"></div>
</div>

<div id="settings">
  <div class="in">
    <h2>設定</h2>
    <p class="help">ここに入れた URL はこの端末のブラウザ（localStorage）にだけ保存されます。</p>
    <label>カードの並び順（変更はすぐ反映されます）</label>
    <div id="orderList"></div>
    <label>Food Inv. Manager の GAS URL</label>
    <input id="inFood" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>NeoNoting の GAS URL</label>
    <input id="inTasks" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Home 用 GAS の URL（家計簿の集計）</label>
    <input id="inBudget" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <p class="help">gas/Code.gs を別の GAS プロジェクトとして公開した URL です。手順は README を参照。</p>
    <label>MedCal の GAS URL（昨日の日記）</label>
    <input id="inMed" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <input id="inMedTok" type="text" placeholder="MedCal の合言葉（MEDCAL_TOKEN と同じもの）" autocomplete="off" style="margin-top:8px">
    <label>食品の「もうすぐ」と見なす日数</label>
    <input id="inWarn" type="number" min="0" max="30" inputmode="numeric">
    <label>各アプリを開くリンク（任意）</label>
    <input id="inLinkFood" type="url" placeholder="Food Inv. Manager の URL">
    <input id="inLinkTasks" type="url" placeholder="NeoNoting の URL" style="margin-top:8px">
    <input id="inLinkMed" type="url" placeholder="Medical Calendar の URL" style="margin-top:8px">
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn" id="btnSave">保存</button>
      <button class="btn ghost" id="btnClose">閉じる</button>
    </div>
    <p class="help" style="margin-top:24px">APP_VERSION <span id="ver"></span></p>
  </div>
</div>

<script>
const APP_VERSION = 'v10';
// Home 用 GAS（gas/Code.gs）の仕様を変えたときだけ上げる。古い GAS のままだと警告を出す
const REQUIRED_GAS_VERSION = '1.1.0';
const LS = { food:'hd_gas_food', tasks:'hd_gas_tasks', budget:'hd_gas_budget', med:'hd_gas_med', medTok:'hd_med_token', warn:'hd_warn_days',
  lfood:'hd_link_food', ltasks:'hd_link_tasks', lmed:'hd_link_med', order:'hd_card_order' };

const lsGet = (k, d='') => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const $ = id => document.getElementById(id);

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// http(s) 以外の URL は href に入れない
function safeUrl(u) { return /^https?:\/\//.test(u) ? u : ''; }

// fetch に Content-Type を付けない（付けると CORS プリフライトが飛び GAS が応答できない）
async function gasCall(url, body, token) {
  if (!url) throw new Error('GAS URL が未設定です（設定から入力）');
  const res = await fetch(url, { method: 'POST', body: JSON.stringify(token ? { ...body, token } : body) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '不明なエラー');
  return json.data;
}

const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
// 'yyyy-MM-dd' 同士の日数差。Date 型で持ち回らず、UTC 正午で 1 日ずれを避ける
function daysUntil(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number), [ty, tm, td] = todayStr().split('-').map(Number);
  return Math.round((Date.UTC(y, m-1, d) - Date.UTC(ty, tm-1, td)) / 86400000);
}
// '1.10.0' 形式の版を数値で比較する
function cmpVer(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; }
  return 0;
}
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');

function warnDays() { const n = Number(lsGet(LS.warn, '3')); return isFinite(n) && n >= 0 ? n : 3; }

function cardHead(icon, title, link) {
  const a = safeUrl(link);
  return `<h2><i class="ti ti-${icon}"></i>${escHtml(title)}${a ? `<a class="go" href="${escHtml(a)}" aria-label="${escHtml(title)}を開く"><i class="ti ti-external-link"></i></a>` : ''}</h2>`;
}
function errBox(msg) { return `<div class="err-t">${escHtml(msg)}</div>`; }

/* ---- 食品 ---- */
// 食品の一覧は「期限」と「買い足す」の 2 枚のカードで使うので、1 回の更新につき 1 回だけ取得する
let foodsCache = null;
function fetchFoods() {
  if (!foodsCache) foodsCache = gasCall(lsGet(LS.food), { action: 'list' });
  return foodsCache;
}
async function loadFood() {
  const head = cardHead('fridge', '食品の期限', lsGet(LS.lfood));
  const el = $('cardFood');
  const url = lsGet(LS.food);
  if (!url) { el.innerHTML = head + '<div class="muted">設定で Food Inv. Manager の GAS URL を入れてください</div>'; return 'skip'; }
  const foods = await fetchFoods();
  const w = warnDays();
  const items = foods
    .filter(f => f.expiryDate && !f.consumed && Number(f.quantity) !== 0)
    .map(f => ({ f, d: daysUntil(f.expiryDate) }))
    .filter(x => x.d <= w)
    .sort((a, b) => a.d - b.d || 0);
  let html = head;
  if (!items.length) html += '<div class="muted">期限が近い食品はありません</div>';
  items.slice(0, 6).forEach(({ f, d }) => {
    const cls = d < 0 ? 'expired' : 'soon';
    const label = d < 0 ? `${-d}日超過` : d === 0 ? '今日' : `あと${d}日`;
    html += `<div class="row"><span class="nm">${escHtml(f.name)}</span><span class="meta">${escHtml(f.place)}</span><span class="badge ${cls}">${label}</span></div>`;
  });
  if (items.length > 6) html += `<div class="muted" style="margin-top:6px">ほか ${items.length - 6} 件</div>`;
  el.innerHTML = html;
}

/* ---- 買い足す（数量 0 の食品。Food Inv. Manager の「買い足す」タブと同じ条件） ---- */
const PLACE_ORDER = ['冷蔵', '冷凍', '常温'];
async function loadRestock() {
  const head = cardHead('shopping-cart', '買い足す', lsGet(LS.lfood));
  const el = $('cardRestock');
  if (!lsGet(LS.food)) { el.innerHTML = head + '<div class="muted">設定で Food Inv. Manager の GAS URL を入れてください</div>'; return 'skip'; }
  const foods = await fetchFoods();
  // 保管場所の順、同じ場所の中は登録順（sort は安定）
  const list = foods.filter(f => !f.consumed && Number(f.quantity) === 0)
    .sort((a, b) => PLACE_ORDER.indexOf(a.place) - PLACE_ORDER.indexOf(b.place));
  let html = head + `<div class="sum"><div><small>切らしている食品</small><span class="big">${list.length}</span></div></div>`;
  if (!list.length) html += '<div class="muted">買い足すものはありません</div>';
  list.slice(0, 10).forEach(f => {
    html += `<div class="row"><span class="nm">${escHtml(f.name)}</span><span class="meta">${escHtml(f.place)}</span></div>`;
  });
  if (list.length > 10) html += `<div class="muted" style="margin-top:6px">ほか ${list.length - 10} 件</div>`;
  el.innerHTML = html;
}

/* ---- タスク（TODAY タグのものだけ） ---- */
const TODAY_TAG = 'TODAY';
function hasTodayTag(t) {
  return (t.tags || []).some(tg => String(typeof tg === 'string' ? tg : (tg && tg.name) || '').trim().toUpperCase() === TODAY_TAG);
}
let tasksCache = null;
function fetchTasks() {
  if (!tasksCache) tasksCache = gasCall(lsGet(LS.tasks), { action: 'list' });
  return tasksCache;
}
async function loadTasks() {
  const head = cardHead('checklist', 'TODAY', lsGet(LS.ltasks));
  const el = $('cardTasks');
  const url = lsGet(LS.tasks);
  if (!url) { el.innerHTML = head + '<div class="muted">設定で NeoNoting の GAS URL を入れてください</div>'; return 'skip'; }
  const data = await fetchTasks();
  const list = Array.isArray(data) ? data : (data && data.tasks) || [];
  const open = list.filter(t => !t.done && hasTodayTag(t)).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  let html = head + `<div class="sum"><div><small>未完了</small><span class="big">${open.length}</span></div></div>`;
  if (!open.length) html += `<div class="muted">${TODAY_TAG} のタスクはありません</div>`;
  open.slice(0, 8).forEach(t => {
    const r = t.reminderAt ? new Date(t.reminderAt) : null;
    const rt = r && !isNaN(r) ? `${r.getMonth()+1}/${r.getDate()} ${pad(r.getHours())}:${pad(r.getMinutes())}` : '';
    html += `<div class="row"><span class="nm">${escHtml(t.name)}</span>${rt ? `<span class="meta">${rt}</span>` : ''}</div>`;
  });
  if (open.length > 8) html += `<div class="muted" style="margin-top:6px">ほか ${open.length - 8} 件</div>`;
  el.innerHTML = html;
}

/* ---- カレンダー（週表示。食品の期限・タスクのリマインド・日ごとの支出） ---- */
const cal = { offset: 0, sel: null, foods: [], tasks: [], spend: {}, spendErr: '', notes: [] };
let spendCache = {};     // 週の開始日 -> { 'yyyy-MM-dd': {expense, count} }。更新のたびに捨てる
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

// 'yyyy-MM-dd' の日付計算は UTC で行う（Date をローカル時刻で持ち回ると 1 日ずれる）
function addDays(str, n) {
  const [y, m, d] = str.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`;
}
function dowOf(str) { const [y, m, d] = str.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }
function weekStart() { const base = addDays(todayStr(), cal.offset * 7); return addDays(base, -dowOf(base)); }
function md(str) { const [, m, d] = str.split('-'); return `${Number(m)}/${Number(d)}`; }
function localDateKey(iso) {
  const t = new Date(iso);
  return isNaN(t) ? '' : `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
}
function foodStatus(d) { return d < 0 ? 'expired' : d <= warnDays() ? 'soon' : 'ok'; }

function calItems(date) {
  const foods = cal.foods.filter(f => f.expiryDate === date && !f.consumed && Number(f.quantity) !== 0);
  const tasks = cal.tasks.filter(t => !t.done && t.reminderAt && localDateKey(t.reminderAt) === date)
    .sort((a, b) => new Date(a.reminderAt) - new Date(b.reminderAt));
  return { foods, tasks, spend: cal.spend[date] || null };
}

async function ensureSpend(start) {
  cal.spendErr = '';
  const url = lsGet(LS.budget);
  if (!url) { cal.spend = {}; return; }
  if (!spendCache[start]) {
    try {
      const rows = await gasCall(url, { action: 'daily', from: start, to: addDays(start, 6) });
      spendCache[start] = Object.fromEntries(rows.map(r => [r.date, r]));
    } catch (e) {
      const msg = String(e && e.message || e);
      cal.spendErr = /unknown action/.test(msg) ? '支出を出すには Home 用 GAS を更新してください（gas/Code.gs を貼り直して再デプロイ）' : '支出を読み込めませんでした: ' + msg;
      cal.spend = {}; return;
    }
  }
  cal.spend = spendCache[start];
}

function renderCalendar() {
  const el = $('cardCal');
  const start = weekStart(), today = todayStr();
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  if (!cal.sel || !days.includes(cal.sel)) cal.sel = days.includes(today) ? today : start;

  let html = cardHead('calendar-week', 'カレンダー', '') + `<div class="calnav">
    <div class="rng">${md(days[0])} – ${md(days[6])}</div>
    <div class="grp"><button data-act="prev" aria-label="前の週">‹</button><button data-act="today">今週</button><button data-act="next" aria-label="次の週">›</button></div></div>
    <div class="wk">`;
  days.forEach(d => {
    const it = calItems(d);
    const worst = it.foods.length ? (it.foods.some(f => daysUntil(f.expiryDate) < 0) ? 'expired' : it.foods.some(f => daysUntil(f.expiryDate) <= warnDays()) ? 'soon' : 'ok') : '';
    const dots = (worst ? `<span class="dot ${worst}"></span>` : '') + (it.tasks.length ? '<span class="dot task"></span>' : '');
    const yenS = it.spend ? (it.spend.expense >= 10000 ? (it.spend.expense / 10000).toFixed(1) + '万' : it.spend.expense >= 1000 ? (it.spend.expense / 1000).toFixed(1) + 'k' : String(it.spend.expense)) : '';
    html += `<div class="wd${d === today ? ' today' : ''}${d === cal.sel ? ' sel' : ''}" data-date="${d}" role="button" aria-label="${md(d)}">
      <div class="dow">${DOW[dowOf(d)]}</div><div class="dn">${Number(d.slice(8))}</div>
      <div class="dots">${dots}</div><div class="yen">${yenS ? '¥' + yenS : ''}</div></div>`;
  });
  html += '</div>';

  const it = calItems(cal.sel);
  html += `<div class="dayh">${md(cal.sel)} (${DOW[dowOf(cal.sel)]})</div>`;
  if (!it.foods.length && !it.tasks.length && !it.spend) html += '<div class="muted">この日の予定・期限・支出はありません</div>';
  it.foods.forEach(f => {
    const dd = daysUntil(f.expiryDate), st = foodStatus(dd);
    const label = dd < 0 ? `${-dd}日超過` : dd === 0 ? '今日' : `あと${dd}日`;
    const badge = st === 'ok' ? `<span class="badge" style="background:var(--accent);color:#111">${label}</span>` : `<span class="badge ${st}">${label}</span>`;
    html += `<div class="row"><i class="ti ti-fridge" style="color:var(--sub)"></i><span class="nm">${escHtml(f.name)}</span><span class="meta">${escHtml(f.place)}</span>${badge}</div>`;
  });
  it.tasks.forEach(t => {
    const r = new Date(t.reminderAt);
    html += `<div class="row"><i class="ti ti-bell" style="color:var(--info)"></i><span class="nm">${escHtml(t.name)}</span><span class="meta">${pad(r.getHours())}:${pad(r.getMinutes())}</span></div>`;
  });
  if (it.spend) html += `<div class="row"><i class="ti ti-wallet" style="color:var(--sub)"></i><span class="nm">支出 ${it.spend.count}件</span><span class="meta">${yen(it.spend.expense)}</span></div>`;

  html += '<div class="legend"><span><i style="background:var(--danger)"></i>期限切れ</span><span><i style="background:var(--warn)"></i>もうすぐ</span><span><i style="background:var(--accent)"></i>期限</span><span><i style="background:var(--info)"></i>リマインド</span><span>¥ 支出</span></div>';
  [...cal.notes, cal.spendErr].filter(Boolean).forEach(m => { html += `<div class="err-t" style="margin-top:6px">${escHtml(m)}</div>`; });
  el.innerHTML = html;
}

async function loadCalendar() {
  const el = $('cardCal');
  if (!lsGet(LS.food) && !lsGet(LS.tasks) && !lsGet(LS.budget)) {
    el.innerHTML = cardHead('calendar-week', 'カレンダー', '') + '<div class="muted">設定で GAS の URL を入れると、期限・リマインド・支出が集まります</div>';
    return 'skip';
  }
  // 1 つの取得元が失敗しても、他は表示する
  const [f, t] = await Promise.allSettled([
    lsGet(LS.food) ? fetchFoods() : Promise.resolve([]),
    lsGet(LS.tasks) ? fetchTasks() : Promise.resolve([]),
  ]);
  cal.notes = [];
  cal.foods = f.status === 'fulfilled' ? f.value : (cal.notes.push('食品を読み込めませんでした: ' + (f.reason && f.reason.message || f.reason)), []);
  const td = t.status === 'fulfilled' ? t.value : (cal.notes.push('タスクを読み込めませんでした: ' + (t.reason && t.reason.message || t.reason)), []);
  cal.tasks = Array.isArray(td) ? td : (td && td.tasks) || [];
  await ensureSpend(weekStart());
  renderCalendar();
}

async function calNav(act) {
  if (act === 'prev') cal.offset--; else if (act === 'next') cal.offset++; else cal.offset = 0;
  cal.sel = null;
  await ensureSpend(weekStart());
  renderCalendar();
}

/* ---- 家計 ---- */
async function loadBudget() {
  const head = cardHead('wallet', '今月の家計', '');
  const el = $('cardBudget');
  const url = lsGet(LS.budget);
  if (!url) { el.innerHTML = head + '<div class="muted">設定で Home 用 GAS の URL を入れてください</div>'; return 'skip'; }
  const b = await gasCall(url, { action: 'budget' });
  const max = b.categories.length ? b.categories[0].amount : 1;
  const stale = cmpVer(b.version || '0', REQUIRED_GAS_VERSION) < 0;
  let html = head + `<div class="sum">
    <div><small>支出</small><span class="big">${yen(b.expense)}</span></div>
    <div><small>収入</small><span class="big" style="font-size:clamp(18px,6vw,26px)">${yen(b.income)}</span></div></div>
    <div class="muted">今日の支出 ${yen(b.todayExpense)} / ${escHtml(b.month)}</div>`;
  b.categories.forEach(c => {
    html += `<div class="cat"><div><span>${escHtml(c.name)}</span><span class="meta">${yen(c.amount)}</span></div>
      <div class="bar"><i style="width:${Math.round(c.amount / max * 100)}%"></i></div></div>`;
  });
  html += `<div class="muted" style="margin-top:10px;font-size:11px">${b.count}件を集計${b.noDate ? ` / 日付が読めない行 ${b.noDate}件` : ''}</div>`;
  if (stale) html += `<div class="err-t" style="margin-top:6px">Home 用 GAS が古い版です。Code.gs を貼り直して、新しいバージョンで再デプロイしてください（必要 ${REQUIRED_GAS_VERSION} / 現在 ${escHtml(b.version || '不明')}）</div>`;
  el.innerHTML = html;
}

/* ---- 昨日の日記（MedCal） ---- */
const DIARY_MAX = 500;
async function loadDiary() {
  const head = cardHead('notebook', '昨日の日記', lsGet(LS.lmed));
  const el = $('cardMed');
  const url = lsGet(LS.med);
  if (!url) { el.innerHTML = head + '<div class="muted">設定で MedCal の GAS URL と合言葉を入れてください</div>'; return 'skip'; }
  const d = await gasCall(url, { action: 'day' }, lsGet(LS.medTok));   // 日付を省略すると GAS 側で昨日になる
  const note = String(d.note || '').trim();
  const [, m, day] = String(d.date).split('-');
  let html = head + `<div class="meta" style="margin-bottom:8px">${Number(m)}/${Number(day)}</div>`;
  if (!note) {
    html += '<div class="muted">昨日の日記はありません</div>';
  } else {
    const cut = note.length > DIARY_MAX;
    html += `<div style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7">${escHtml(cut ? note.slice(0, DIARY_MAX) + '…' : note)}</div>`;
    if (cut) html += '<div class="muted" style="margin-top:6px">続きは MedCal で</div>';
  }
  el.innerHTML = html;
}

/* ---- 更新 ---- */
function setSync(state) { $('sdot').className = 'sdot ' + state; }

async function refresh() {
  setSync('busy');
  foodsCache = null; tasksCache = null; spendCache = {};
  const jobs = [
    ['cardFood', loadFood, () => cardHead('fridge', '食品の期限', lsGet(LS.lfood))],
    ['cardRestock', loadRestock, () => cardHead('shopping-cart', '買い足す', lsGet(LS.lfood))],
    ['cardTasks', loadTasks, () => cardHead('checklist', 'TODAY', lsGet(LS.ltasks))],
    ['cardCal', loadCalendar, () => cardHead('calendar-week', 'カレンダー', '')],
    ['cardBudget', loadBudget, () => cardHead('wallet', '今月の家計', '')],
    ['cardMed', loadDiary, () => cardHead('notebook', '昨日の日記', lsGet(LS.lmed))]];
  // 1 つが失敗しても他のカードは表示する
  const results = await Promise.allSettled(jobs.map(j => j[1]()));
  let failed = 0;
  results.forEach((r, i) => {
    if (r.status === 'rejected') {
      failed++;
      $(jobs[i][0]).innerHTML = jobs[i][2]() + errBox(String(r.reason && r.reason.message || r.reason));
    }
  });
  setSync(failed ? 'err' : 'ok');
}

/* ---- カードの並び順 ---- */
const CARDS = [
  { id: 'cardFood',   name: '食品の期限' },
  { id: 'cardRestock', name: '買い足す' },
  { id: 'cardTasks',  name: 'TODAY' },
  { id: 'cardCal',    name: 'カレンダー' },
  { id: 'cardBudget', name: '今月の家計' },
  { id: 'cardMed',    name: '昨日の日記' },
];
// 保存された順を使い、知らない id は捨て、足りないカードは末尾に足す
function cardOrder() {
  let saved = [];
  try { saved = JSON.parse(lsGet(LS.order, '[]')); } catch {}
  const ids = CARDS.map(c => c.id);
  const out = (Array.isArray(saved) ? saved : []).filter((id, i, a) => ids.includes(id) && a.indexOf(id) === i);
  ids.forEach(id => { if (!out.includes(id)) out.push(id); });
  return out;
}
function applyCardOrder() {
  const app = $('app');
  cardOrder().forEach(id => app.appendChild($(id)));   // 既存の要素を並べ替えるだけ（中身は触らない）
}
function renderOrderList() {
  const order = cardOrder();
  $('orderList').innerHTML = order.map((id, i) => {
    const name = CARDS.find(c => c.id === id).name;
    return `<div class="order-row"><span class="nm">${escHtml(name)}</span>
      <button data-id="${id}" data-dir="-1" aria-label="${escHtml(name)}を上へ" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button data-id="${id}" data-dir="1" aria-label="${escHtml(name)}を下へ" ${i === order.length - 1 ? 'disabled' : ''}>↓</button></div>`;
  }).join('');
}
function moveCard(id, dir) {
  const order = cardOrder(), i = order.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  lsSet(LS.order, JSON.stringify(order));
  applyCardOrder(); renderOrderList();
}

/* ---- 設定 ---- */
function openSettings() {
  $('inFood').value = lsGet(LS.food); $('inTasks').value = lsGet(LS.tasks); $('inBudget').value = lsGet(LS.budget); $('inMed').value = lsGet(LS.med); $('inMedTok').value = lsGet(LS.medTok);
  $('inWarn').value = warnDays();
  $('inLinkFood').value = lsGet(LS.lfood); $('inLinkTasks').value = lsGet(LS.ltasks); $('inLinkMed').value = lsGet(LS.lmed);
  renderOrderList();
  $('settings').style.display = 'block';
}
function closeSettings() { $('settings').style.display = 'none'; }
function saveSettings() {
  lsSet(LS.food, $('inFood').value.trim()); lsSet(LS.tasks, $('inTasks').value.trim()); lsSet(LS.budget, $('inBudget').value.trim()); lsSet(LS.med, $('inMed').value.trim()); lsSet(LS.medTok, $('inMedTok').value.trim());
  lsSet(LS.warn, String(Math.max(0, Number($('inWarn').value) || 0)));
  lsSet(LS.lfood, $('inLinkFood').value.trim()); lsSet(LS.ltasks, $('inLinkTasks').value.trim()); lsSet(LS.lmed, $('inLinkMed').value.trim());
  closeSettings(); refresh();
}

// Capacitor（Android アプリ）との連携。window.Capacitor が無ければ何もしない
function setupCapacitor() {
  const cap = window.Capacitor;
  if (!cap || !cap.Plugins || !cap.Plugins.App) return;
  const App = cap.Plugins.App;
  // 戻るボタン: 設定画面 → アプリ終了
  App.addListener('backButton', () => {
    if ($('settings').style.display === 'block') closeSettings();
    else App.exitApp();
  });
  // 前面に戻ったら更新（visibilitychange が WebView で飛ばないことがあるため）
  App.addListener('appStateChange', state => { if (state && state.isActive) refresh(); });
}

function init() {
  const d = new Date();
  $('today').textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} (${'日月火水木金土'[d.getDay()]})`;
  $('ver').textContent = APP_VERSION;
  $('btnRefresh').onclick = refresh;
  $('btnSettings').onclick = openSettings;
  $('btnClose').onclick = closeSettings;
  $('btnSave').onclick = saveSettings;
  $('orderList').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (b) moveCard(b.dataset.id, Number(b.dataset.dir));
  });
  $('cardCal').addEventListener('click', e => {
    const nav = e.target.closest('button[data-act]');
    if (nav) { calNav(nav.dataset.act); return; }
    const day = e.target.closest('.wd[data-date]');
    if (day) { cal.sel = day.dataset.date; renderCalendar(); }
  });
  applyCardOrder();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  ['cardFood','cardRestock','cardTasks','cardCal','cardBudget'].forEach(id => $(id).innerHTML = '<div class="skeleton">読み込み中...</div>');
  $('cardMed').innerHTML = '<div class="skeleton">読み込み中...</div>';
  setupCapacitor();
  refresh();
}
init();
</script>
